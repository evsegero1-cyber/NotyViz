plugins {
    id 'com.android.application'
}

android {
    namespace 'ru.sergey.notyviz'
    compileSdk 35

    defaultConfig {
        applicationId 'ru.sergey.notyviz'
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName '0.3'
    }

    signingConfigs {
        release {
            storeFile file('release.jks')
            storePassword 'notyviz123'
            keyAlias 'notyviz'
            keyPassword 'notyviz123'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    androidResources {
        noCompress 'mjs', 'js', 'sf3', 'woff2', 'woff', 'otf'
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
